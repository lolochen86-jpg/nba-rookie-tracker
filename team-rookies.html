<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>各球隊新人名單｜NBA 新秀追蹤</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090d16;color:#f1f5f9;font:15px system-ui,-apple-system,"Microsoft JhengHei",sans-serif}main{max-width:1440px;margin:auto;padding:28px}a{color:#93c5fd}h1{font-size:28px;color:#fb923c}p,small{color:#a7b7cc;line-height:1.8}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}select,input,button{font:inherit;color:inherit;border:1px solid #334155;background:#16243a;border-radius:8px;padding:11px}input{flex:1;min-width:200px}.team{border:1px solid #334155;background:#111c2e;border-radius:16px;margin:20px 0;padding:20px}.team h2{font-size:21px;margin:0 0 16px}.cohorts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}h3{font-size:16px;color:#fdba74}h3.second{color:#93c5fd}ul{list-style:none;margin:0;padding:0}.player{display:flex;gap:12px;align-items:center;border-top:1px solid #26344c;padding:14px 0}.portrait{width:76px;height:76px;flex:none;display:grid;place-items:center;background:#1e293b;border-radius:12px;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover}.identity{min-width:0}.identity strong{display:block;overflow-wrap:anywhere}.identity small{display:block}.year{font-weight:bold;color:#fdba74;margin-right:6px}.year.y26{color:#93c5fd}.gp{color:#72dfb1;font-size:13px}.empty{color:#a7b7cc;padding:14px 0}.meta{background:#111c2e;border:1px solid #334155;border-radius:12px;padding:14px;line-height:1.8}.team-count{font-size:13px;color:#a7b7cc;font-weight:normal}@media(max-width:650px){main{padding:18px 14px}.cohorts{grid-template-columns:1fr;gap:4px}.team{padding:16px}.toolbar select{width:100%}h1{font-size:24px}}
</style></head><body><main><a href="./">← 返回原排行榜</a><h1>各球隊一、二年級新人名單</h1><p>27＝2026–27 一年級；26＝2025–26 首年、目前二年級。依 ESPN 當前球隊名單列出，包含尚未出賽者；屆別優先沿用已確認名冊，其餘依 ESPN 年資 0／1 年判定。已離隊球員不列在現有球隊名單，但已出賽者仍保留在排行榜。</p><div class="meta" id="meta" role="status">正在讀取球隊名單…</div><div class="toolbar"><select id="team" aria-label="球隊篩選"><option value="all">全部 30 支球隊</option></select><select id="year" aria-label="年級篩選"><option value="all">一年級＋二年級</option><option value="27">27 · 一年級</option><option value="26">26 · 二年級</option></select><input id="search" aria-label="搜尋球員" placeholder="搜尋球員中文／英文名字"><button id="refresh">重新讀取</button></div><div id="result" role="status"></div><section id="teams" aria-label="各球隊新人名單"></section><p>資料來源：ESPN 球隊名單及已完賽例行賽技術統計。每天台灣時間 14:00 更新，GitHub 排程可能延遲。名單與成績使用同一次成功同步快照；「重新讀取」不會啟動後端抓取。</p></main><script>
const TEAM_NAMES={"ATL":"老鷹","BOS":"塞爾提克","BKN":"籃網","CHA":"黃蜂","CHI":"公牛","CLE":"騎士","DAL":"獨行俠","DEN":"金塊","DET":"活塞","GSW":"勇士","HOU":"火箭","IND":"溜馬","LAC":"快艇","LAL":"湖人","MEM":"灰熊","MIA":"熱火","MIL":"公鹿","MIN":"灰狼","NOP":"鵜鶘","NYK":"尼克","OKC":"雷霆","ORL":"魔術","PHI":"76人","PHX":"太陽","POR":"拓荒者","SAC":"國王","SAS":"馬刺","TOR":"暴龍","UTA":"爵士","WAS":"巫師"};
const $=id=>document.getElementById(id),escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let teams=[];
function render(){const chosen=$('team').value,year=$('year').value,query=$('search').value.trim().toLowerCase();let count=0,teamCount=0;
 $('teams').innerHTML=teams.filter(t=>chosen==='all'||t.team===chosen).map(t=>{
 const members=t.players.filter(p=>(year==='all'||p.year===year)&&`${p.nameZh} ${p.nameEn}`.toLowerCase().includes(query));if(query&&!members.length)return '';count+=members.length;teamCount++;
 const column=y=>{const list=members.filter(p=>p.year===y);return `<div><h3 class="${y==='26'?'second':''}">${y} · ${y==='27'?'一年級':'二年級'}（${list.length} 位）</h3><ul>${list.map(p=>{const href=p.nbaPersonId&&p.gp>0?'./player.html?id='+Number(p.nbaPersonId):'https://www.espn.com/nba/player/_/id/'+Number(p.espnId);const source=p.nbaPersonId&&p.gp>0?'個人數據':'ESPN 球員頁';return `<li class="player"><span class="year y${y}">${y}</span><div class="portrait">${/^https:\/\//.test(p.headshot)?`<img src="${escapeHtml(p.headshot)}" alt="${escapeHtml(p.nameEn)}" loading="lazy">`:'NBA'}</div><div class="identity"><strong><a href="${href}">${escapeHtml(p.nameZh)}</a></strong><small>${escapeHtml(p.nameEn)}</small><small>#${escapeHtml(p.jersey||'—')} · ${escapeHtml(p.pos||'—')} · ${source}</small><span class="gp">${p.gp>0?'本季已出賽 '+p.gp+' 場':'本季尚未出賽'}</span></div></li>`;}).join('')||'<li class="empty">'+(query?'沒有符合搜尋條件的球員':'本次名單無此年級球員')+'</li>'}</ul></div>`;};
 return `<article class="team"><h2>${escapeHtml(TEAM_NAMES[t.team]||t.team)} <span class="team-count">${escapeHtml(t.team)} · ${members.length} 位</span></h2><div class="cohorts">${year!=='26'?column('27'):''}${year!=='27'?column('26'):''}</div></article>`;}).join('');$('result').textContent=`顯示 ${teamCount} 支球隊、${count} 位球員`;if(!teamCount)$('teams').textContent='沒有符合條件的球員。';}
async function load(){const button=$('refresh');button.disabled=true;try{const r=await fetch('./data/rookies_latest.json',{cache:'no-store'});if(!r.ok)throw Error('讀取失敗');const d=await r.json(),snapshot=d.teamRosters;if(!snapshot||snapshot.teams.length!==30)throw Error('球隊名單尚未同步完成');teams=snapshot.teams.slice().sort((a,b)=>a.team.localeCompare(b.team));const previous=$('team').value;$('team').innerHTML='<option value="all">全部 30 支球隊</option>'+teams.map(t=>`<option value="${escapeHtml(t.team)}">${escapeHtml(TEAM_NAMES[t.team]||t.team)} ${escapeHtml(t.team)}</option>`).join('');$('team').value=teams.some(t=>t.team===previous)?previous:'all';$('meta').textContent='ESPN 球隊名單 · 成功更新：'+new Date(snapshot.updatedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})+'（台灣時間） · '+snapshot.teams.length+' 支球隊';render();}catch(e){$('meta').textContent='暫時無法取得新名單：'+e.message+'。'+(teams.length?'保留上次成功畫面。':'請稍後重新讀取。');}finally{button.disabled=false;}}
$('team').onchange=render;$('year').onchange=render;$('search').oninput=render;$('refresh').onclick=load;load();
</script></body></html>
