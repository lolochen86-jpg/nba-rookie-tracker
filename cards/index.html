<script>
document.getElementById('redirect-fallback').remove();
(async()=>{let target='https://wendy-potatoes-lang-demanding.trycloudflare.com';const valid=s=>typeof s==='string'&&/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(s);
